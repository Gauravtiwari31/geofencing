<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tourist Heartbeat Sender</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Tourist Heartbeat Sender</h1>
      <div class="toolbar">
        <label>Target URL</label>
        <input id="targetUrl" type="text" placeholder="http://localhost:2030/v1/app/ingest" />
        <label>Device ID</label>
        <input id="deviceId" type="text" placeholder="tourist-sim-001" />
        <label>Interval (s)</label>
        <input id="interval" type="number" min="1" value="5" />
        <button id="saveCfg">Save</button>
        <button id="startHb">Start Heartbeat</button>
        <button id="stopHb">Stop</button>
      </div>
    </header>

    <main class="grid">
      <section class="map-panel">
        <div id="map" class="map"></div>
        <div class="map-controls">
          <button id="viewIndia">🇮🇳 View India</button>
          <button id="zoomLoc">📍 Zoom to Location</button>
        </div>
        <div class="coords">Lat,Lng: <span id="coords">--</span></div>
      </section>

      <section class="actions-panel">
        <div class="section">
          <h3>Set Location</h3>
          <div class="row">
            <input id="lat" type="number" step="0.000001" placeholder="Latitude" />
            <input id="lng" type="number" step="0.000001" placeholder="Longitude" />
            <button id="setLoc">Set</button>
          </div>
          <div class="row presets">
            <button class="preset" data-lat="26.1625" data-lng="91.7794">Guwahati</button>
            <button class="preset" data-lat="27.1750" data-lng="78.0422">Taj Mahal</button>
            <button class="preset" data-lat="19.0760" data-lng="72.8777">Mumbai</button>
          </div>
        </div>

        <div class="section">
          <h3>Actions</h3>
          <button id="sendOnce">Send Location Now</button>
          <button id="sosBtn" class="sos">🚨 SOS</button>
        </div>

        <div class="section">
          <h3>Status</h3>
          <div id="status">Idle</div>
        </div>

        <div class="section">
          <h3>Activity Log</h3>
          <div id="log" class="log"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
