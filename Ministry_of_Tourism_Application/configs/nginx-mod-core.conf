# MoD Core Nginx Configuration
# Reverse proxy with mTLS termination

user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /workspace/logs/nginx.error.log;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format
    log_format mod_core '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time" '
                       'ssl_client_s_dn="$ssl_client_s_dn" '
                       'ssl_client_verify="$ssl_client_verify"';

    access_log /workspace/logs/nginx.access.log mod_core;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # Upstream to FastAPI
    upstream mod_api_backend {
        server 127.0.0.1:2030;
        keepalive 32;
    }

    # Main HTTPS Server with mTLS
    server {
        listen 2025 ssl http2;
        server_name localhost mod-core;

        # SSL Configuration
        ssl_certificate /workspace/ssl-certs/server.crt;
        ssl_certificate_key /workspace/ssl-certs/server.key;
        
        # Client Certificate Authentication (mTLS)
        ssl_client_certificate /workspace/ssl-certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client Certificate Headers for Backend
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Issuer $ssl_client_i_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Health Check (no rate limiting)
        location /health {
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Ready Check (no rate limiting)
        location /ready {
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Tourist API with rate limiting
        location /v1/app/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Longer timeout for telemetry processing
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Police API with stricter rate limiting and SSE support
        location /v1/police/ {
            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            
            # Support for Server-Sent Events
            location /v1/police/stream {
                proxy_pass http://mod_api_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;  # 1 hour for long-lived connections
                
                # SSE Headers
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # Metrics endpoint (internal only)
        location /metrics {
            allow 127.0.0.1;
            deny all;
            
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Default route
        location / {
            proxy_pass http://mod_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Error Pages
        error_page 400 /error/400.html;
        error_page 401 /error/401.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 502 503 504 /error/5xx.html;

        location /error/ {
            internal;
            root /workspace/static;
        }
    }

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name localhost mod-core;
        return 301 https://$server_name:2025$request_uri;
    }

    # Metrics server for Prometheus scraping
    server {
        listen 127.0.0.1:2032;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
