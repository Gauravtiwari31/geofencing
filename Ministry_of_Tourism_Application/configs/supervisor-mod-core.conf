[supervisord]
nodaemon=false
user=root
childlogdir=/workspace/logs
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid

[inet_http_server]
port=127.0.0.1:2031

[supervisorctl]
serverurl=http://127.0.0.1:2031

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# PostgreSQL Database
[program:mod-db]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/var/lib/postgresql/14/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/postgresql.log
stderr_logfile=/workspace/logs/postgresql.error.log
environment=PGDATA="/var/lib/postgresql/14/main"

# FastAPI Core Application
[program:mod-api]
command=/workspace/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 2030 --workers 1
directory=/workspace
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/mod-api.log
stderr_logfile=/workspace/logs/mod-api.error.log
environment=DATABASE_URL="postgresql://moduser:modpass@localhost:2026/modcore",PYTHONPATH="/workspace"

# Nginx Reverse Proxy (when configured)
[program:mod-proxy]
command=/usr/sbin/nginx -g "daemon off;" -c /workspace/configs/nginx-mod-core.conf
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/nginx.log
stderr_logfile=/workspace/logs/nginx.error.log

# Keycloak Identity Provider
[program:keycloak]
command=/opt/keycloak/bin/kc.sh start --hostname-strict=false --hostname-port=2027 --https-port=2027 --https-certificate-file=/workspace/ssl-certs/keycloak.crt --https-certificate-key-file=/workspace/ssl-certs/keycloak.key
directory=/opt/keycloak
user=keycloak
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/keycloak.log
stderr_logfile=/workspace/logs/keycloak.error.log
environment=KEYCLOAK_ADMIN="admin",KEYCLOAK_ADMIN_PASSWORD="admin123"

# Prometheus Monitoring
[program:prometheus]
command=/opt/prometheus/prometheus --config.file=/workspace/configs/prometheus.yml --storage.tsdb.path=/workspace/data/prometheus --web.listen-address=:2028 --web.enable-lifecycle
directory=/opt/prometheus
user=prometheus
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/prometheus.log
stderr_logfile=/workspace/logs/prometheus.error.log

# Grafana Dashboards
[program:grafana]
command=/opt/grafana/bin/grafana-server --config=/workspace/configs/grafana.ini --homepath=/opt/grafana
directory=/opt/grafana
user=grafana
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/grafana.log
stderr_logfile=/workspace/logs/grafana.error.log
environment=GF_SERVER_HTTP_PORT="2029"

# Ethereum Adapter Service
[program:eth-adapter]
command=/workspace/venv/bin/python -m app.services.ethereum_adapter
directory=/workspace
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/eth-adapter.log
stderr_logfile=/workspace/logs/eth-adapter.error.log
environment=PYTHONPATH="/workspace"

# Notification Service
[program:notifier]
command=/workspace/venv/bin/python -m app.services.notifier
directory=/workspace
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/workspace/logs/notifier.log
stderr_logfile=/workspace/logs/notifier.error.log
environment=PYTHONPATH="/workspace"

# Group definitions for easy management
[group:core]
programs=mod-db,mod-api
priority=100

[group:security]
programs=keycloak,mod-proxy
priority=200

[group:monitoring]
programs=prometheus,grafana
priority=300

[group:services]
programs=eth-adapter,notifier
priority=400
